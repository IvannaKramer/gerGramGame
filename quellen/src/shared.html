<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}}: {{TOPIC}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Grandstander:wght@600;800&display=swap">
<style>
{{CSS}}
</style>
</head>
<body>
<noscript><p style="padding:20px">Bitte JavaScript aktivieren, damit das Spiel funktioniert.</p></noscript>

<main class="wrap">

  <!-- Startseite -->
  <section id="screen-start" class="screen active" aria-labelledby="start-title">
    <a class="back-link" href="index.html">← Alle Spiele</a>
    <div class="hero">
      <span class="owl-slot" data-owl></span>
      <div>
        <span class="level">{{LEVEL}} · Spiel {{NR}} von 6</span>
        <h1 class="title" id="start-title" tabindex="-1">{{TITLE}}</h1>
        <p class="subtitle">{{SUBTITLE}}</p>
      </div>
    </div>

    <div class="tipp"><span class="tipp-tag">Tipp</span><p>{{TIPP}}</p></div>

    <p class="section-lead">{{LEAD}}</p>
    <div class="legend">
{{EXAMPLES}}
    </div>

    <div class="howto">
      <h2>So geht’s</h2>
      <ol>
{{HOWTO}}
      </ol>
    </div>

    <div class="startbox">
      <div class="tally" id="tally" hidden></div>
      <button class="btn btn-primary big" id="start-btn">Spiel starten</button>
    </div>
    <div class="start-foot"><button class="linkbtn" id="reset">Fortschritt löschen</button></div>
  </section>

  <!-- Spiel -->
  <section id="screen-game" class="screen" aria-labelledby="game-title">
    <div class="topbar">
      <button class="iconbtn" id="home" aria-label="Zur Startseite">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>
        <span>Start</span>
      </button>
      <h2 class="phase-title" id="game-title" tabindex="-1">{{TITLE}}</h2>
      <div class="progress">
        <div class="progress-text" id="progress-text" aria-live="polite">0 von {{TOTAL}} geschafft</div>
        <div class="segs" id="segs" aria-hidden="true"></div>
      </div>
      <div class="score" aria-live="polite">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path class="star-on" d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8z" stroke-width="1.6" stroke-linejoin="round"/></svg>
        <span id="score">0 Punkte</span>
      </div>
      <button class="iconbtn sound-btn" aria-pressed="true" aria-label="Ton an"></button>
    </div>

{{BOARD}}

    <div class="coach">
      <span class="owl-slot" data-owl data-owl-id="coach-owl"></span>
      <div class="bubble" id="bubble" aria-live="polite"></div>
    </div>

{{TRAY}}
  </section>

  <!-- Erfolg -->
  <section id="screen-done" class="screen" aria-labelledby="done-title">
    <div class="done-card" id="done-card"></div>
  </section>
</main>

<div id="fx" aria-hidden="true"></div>
<canvas id="confetti" aria-hidden="true"></canvas>

<script>
{{JS}}
</script>
</body>
</html>
